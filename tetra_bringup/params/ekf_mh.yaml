### ekf config file ###
ekf_filter_node:
    ros__parameters:
        # 2026-11-24 맵핑 품질 분석: 예전 MH 만 30 Hz 였다. EKF TF 가 스캔보다 늦어 라이다 합치기(odom 움직임 보정)가
        # 스캔을 자주 버렸다. H 와 같은 60 Hz
        frequency: 60.0
        two_d_mode: true #false
        transform_time_offset: 0.0
        transform_timeout: 0.1
        publish_tf: true

        map_frame: map              # Defaults to "map" if unspecified
        odom_frame: odom            # Defaults to "odom" if unspecified
        base_link_frame: base_footprint  # Defaults to "base_link" if unspecified
        world_frame: odom           # Defaults to the value of odom_frame if unspecified

        # 바퀴에서는 위치 변화량(x, y differential)만 받고, 회전은 IMU 자이로(vyaw)가 맡는다 (H·S·SM 과 같다).
        # 예전 MH 는 바퀴 yaw 를 절대값으로 받았는데 /odom 공분산이 0 이라 EKF 가 바퀴 방향을 그대로 따라,
        # 회전할 때 바퀴 미끄럼만큼 방향이 틀어져 지도 바깥 벽이 0.3~0.5 m 어긋나고 이중으로 그려졌다 (2026-11-24 맵핑)
        odom0: odom
        odom0_config: [true,  true,  false,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]

        odom0_differential: true


        imu0: imu/data
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]

        imu0_differential: false
        imu0_linear_acceleration_rejection_threshold: 0.55 # 0.8
        imu0_remove_gravitational_acceleration: true


