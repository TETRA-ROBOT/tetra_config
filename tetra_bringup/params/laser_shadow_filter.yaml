# H/MH 전방·후방 SICK 필터 공용 설정.
# laser_filters 예제 yaml은 노드 이름(scan_to_scan_filter_chain)에 묶여 있어
# 노드 이름을 front/rear로 나누면 적용되지 않으므로 와일드카드(/**)로 정의한다.
/**:
  ros__parameters:
    filter1:
      name: shadows
      type: laser_filters/ScanShadowsFilter
      params:
        min_angle: 10.
        max_angle: 170.
        neighbors: 20
        window: 1
    filter2:
      name: dark_shadows
      type: laser_filters/LaserScanIntensityFilter
      params:
        lower_threshold: 100.
        upper_threshold: 10000.
        disp_histogram: 0
