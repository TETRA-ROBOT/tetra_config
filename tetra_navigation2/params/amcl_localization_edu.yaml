amcl:
  ros__parameters:
    # use_sim_time 은 런치 인자(실로봇 False / 시뮬 True)가 정한다. 여기서 true 로 박아 두면
    # 실로봇에서도 /clock 없이 sim time 으로 떠서 AMCL 시계가 0 에 머문다.
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.0
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.3
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.5 #2.0
    laser_max_range: 25.0 #100.0
    laser_min_range: -1.0
    # likelihood_field 는 빔 점수를 '더해서' 가중치를 만든다. EDU(R270 3D→2D 슬라이스) 지도에서
    # 13.5° 틀린 자세와 맞는 자세의 가중치 차이가 1.6 배뿐이라, 정지 상태 공분산이 ±13cm 에 머물고
    # 오도메트리(바퀴만) 요 오차를 끝내 보정하지 못했다. _prob 는 빔 확률을 곱해서(로그 합) 같은 비교가
    # 32 nats 차이로 벌어진다. z_rand 0.5 가 사람 같은 동적 장애물 빔 하나의 감점을 log(0.02) 로 묶어 준다.
    laser_model_type: "likelihood_field_prob"
    max_beams: 60
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_fast: 0.5
    recovery_alpha_slow: 0.0001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2 #1.0
    update_min_a: 0.1 #0.2
    update_min_d: 0.15 #0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

      
