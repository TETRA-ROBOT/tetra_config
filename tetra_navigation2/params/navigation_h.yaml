bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 60 #20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 복구 중 회전(Spin)·후진(BackUp)을 하지 않는 TETRA BT (behavior_trees/ 머리말 참고). Jazzy 는 navigator 별
    # bt_xml_filename 을 읽지 않으므로 반드시 이 두 키로 준다 (없으면 Nav2 기본 BT 의 0.3 m 후진이 돈다)
    default_nav_to_pose_bt_xml: "$(find-pkg-share tetra_navigation2)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share tetra_navigation2)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    use_feedback: true
    
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    current_goal_checker: "general_goal_checker"
    current_progress_checker: "progress_checker"
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    odom_topic: /odometry/filtered
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3 #0.6 #1.0
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1 #0.25
      yaw_goal_tolerance: 0.0274533 #0.0349066 #0.0872665
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.8
      inflation_cost_scaling_factor: 1.75 #3.0
      lookahead_dist: 0.8  # Adjust to balance between responsiveness and smoothness
      lookahead_time: 1.0 #1.2  # Dynamic lookahead adjustment based on speed
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_vel: 0.8 #1.0  # Allow sufficient angular velocity for tight turns
      max_angular_accel: 3.3
      max_lookahead_dist: 1.5
      min_lookahead_dist: 0.5  # Large enough for the robot to navigate tight turns smoothly
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.05 #0.0
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_heading_angular_vel: 0.785398
      rotate_to_heading_min_angle: 0.785398
      transform_tolerance: 0.2 #0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true  # Use costmap values for speed scaling
      use_interpolation: true #false
      use_regulated_linear_velocity_scaling: true  # Slow down near obstacles
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false #false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0 #10.0
      publish_frequency: 15.0 #10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10 #8
      height: 10 #8
      resolution: 0.05
      # 뒤쪽 안테나가 차체 뒤로 7 cm 튀어나와 뒤 끝을 -0.504 m 로 둔다 (폭은 모르므로 뒷면 전체). 예전 0.434 정사각형은 안테나를 빼서
      # 후진 복구가 "뒤에 공간 있음"으로 보고 안테나를 장애물에 밀어 넣었다
      footprint: "[[0.434,0.434], [-0.504,0.434], [-0.504,-0.434], [0.434,-0.434]]"
      plugins: ["obstacle_layer", "stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.58 #1.0
        cost_scaling_factor: 1.75 #3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan virtual_obstacle_source scan_b
        scan:
          topic: /scan_filtered_1 #/scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
        scan2:
          topic: /scan_filtered_2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
        virtual_obstacle_source:
          topic: /Local_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0 #2.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15.0
        mark_threshold: 2
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true #false
        transform_tolerance: 0.1 #0.2 #1.0
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_cloud #realsense_cloud
        realsense_cloud:
          data_type: "PointCloud2"
          topic: /camera1/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 2.0
          min_obstacle_height: 0.1 #0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0 # 0.7
          min_z: 0.1
          vertical_fov_angle: 1.01229 #0.7
          horizontal_fov_angle: 1.51844 #1.20428
          decay_acceleration: 2.0 #1.0
          model_type: 0
        livox_cloud:
          data_type: "PointCloud2"
          topic: /livox/lidar
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0 # 0.7
          min_z: 0.1
          vertical_fov_angle: 0.907571 #52deg
          horizontal_fov_angle: 6.28319 #360deg
          decay_acceleration: 0.0 #1.0
          model_type: 0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 5.0 #10.0
      publish_frequency: 5.0 #10.0
      width: 15
      height: 15
      global_frame: map
      robot_base_frame: base_footprint
      # 뒤쪽 안테나가 차체 뒤로 7 cm 튀어나와 뒤 끝을 -0.504 m 로 둔다 (폭은 모르므로 뒷면 전체). 예전 0.434 정사각형은 안테나를 빼서
      # 후진 복구가 "뒤에 공간 있음"으로 보고 안테나를 장애물에 밀어 넣었다
      footprint: "[[0.434,0.434], [-0.504,0.434], [-0.504,-0.434], [0.434,-0.434]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 관제 API(TetraSingleManagement lib/robot/zones)가 보내는 PENALTY 구간("되도록 피함") 마스크.
      # 마스크 값(%)이 비용이 된다. 구간이 없으면 마스크가 0 이라 예전과 같다. 레이어가 아니라 filters 에 둔다 (모든 레이어 뒤에 적용)
      filters: ["zone_keepout_filter"]
      zone_keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: virtual_obstacle_source scan
        scan:
          topic: /scan_merge #/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        virtual_obstacle_source:
          topic: /Global_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

map_server:
  ros__parameters:
    yaml_filename: "" #"office.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 15.0 #20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint #base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 2.0]
    min_velocity: [-2.0, 0.0, -2.0]
    max_accel: [0.3, 0.0, 3.3] # [3.5, 0.0, 3.5]
    max_decel: [-0.3, 0.0, -3.3] # [-3.5, 0.0, -3.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav2"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    # 예전에는 감속(slowdown 50 %) 다각형 하나뿐이라 라이다에 장애물이 보여도 한 번도 서지 않고 느리게 밀고 들어갔다
    # (복구 후진으로 뒤쪽 안테나 파손). MH 처럼 짧은 정지 다각형을 따로 두고, 감속 다각형은 예전 그대로 둔다.
    # 정지 다각형 끝 = 발자국(앞 0.434 m, 뒤 0.504 m: 안테나 7 cm) + 최악 정지거리 + 0.1 m 여유. 정지거리는 MH 와 같은 식(지연 0.238 s + v^2/(2*1.5) + v*0.025 s,
    # H 휠드라이버 정지 램프는 아직 실측 안 함): v 0.15 -> 0.05 m, 0.45 -> 0.19 m, 1.0 -> 0.60 m, 후진 0.3 -> 0.11 m.
    # 제자리 회전: 안테나 쪽 뒤 모서리(-0.504, ±0.434)가 쓸고 가는 반경 0.665 m + 3.5 cm 를 감싸는 팔각형 (앞뒤·좌우 0.70 m).
    # 회전 다각형 안에 장애물이 있으면 제자리 회전을 멈추고, 그 자리에서 대기·재시도 뒤 목표가 실패로 끝난다.
    # 도킹·언도킹은 docking_server 가 cmd_vel_nav2 로 바로 보내 이 다각형을 거치지 않는다. 웹 조그(cmd_vel_manual)도 거치지 않는다.
    polygons: ["VelocityPolygonHalt", "VelocityPolygonStop"]
    VelocityPolygonHalt:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_stop"
      velocity_polygons: ["rotation", "forward_creep", "forward_slow", "forward_fast", "backward"]
      holonomic: false
      rotation:
        points: "[[0.70, 0.29], [0.29, 0.70], [-0.29, 0.70], [-0.70, 0.29], [-0.70, -0.29], [-0.29, -0.70], [0.29, -0.70], [0.70, -0.29]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -2.0
        theta_max: 2.0
      # 목표 근처 저속 접근(min_approach_linear_velocity 0.05)은 벽 앞 12 cm 까지 들어갈 수 있게 짧게 둔다
      forward_creep:
        points: "[[0.55, 0.45], [0.55, -0.45], [-0.52, -0.45], [-0.52, 0.45]]"
        linear_min: 0.02
        linear_max: 0.15
        theta_min: -2.0
        theta_max: 2.0
      forward_slow:
        points: "[[0.75, 0.45], [0.75, -0.45], [-0.52, -0.45], [-0.52, 0.45]]"
        linear_min: 0.15
        linear_max: 0.45
        theta_min: -2.0
        theta_max: 2.0
      forward_fast:
        points: "[[1.15, 0.45], [1.15, -0.45], [-0.52, -0.45], [-0.52, 0.45]]"
        linear_min: 0.45
        linear_max: 2.0
        theta_min: -2.0
        theta_max: 2.0
      # 후진은 Nav2 가 더 이상 하지 않지만(RPP allow_reversing 끔, BT 에서 BackUp 제거) 들어오면 뒤 0.72 m(안테나 끝 + 21 cm) 안에서 선다.
      # 좌우는 회전 반경만큼 넓혀 후진하며 도는 동안 뒤쪽 모서리(안테나)가 쓸고 가는 자리도 본다
      backward:
        points: "[[0.45, 0.70], [0.45, -0.70], [-0.72, -0.70], [-0.72, 0.70]]"
        linear_min: -2.0
        linear_max: -0.02
        theta_min: -2.0
        theta_max: 2.0
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "slowdown" #"stop"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_slow"
      # 앞에서부터 처음 맞는 다각형을 쓴다. 뒤의 rotating·forward_turning·backward_turning 은 앞 네 개가 덮지 못하던
      # 제자리 회전(|w| > 0.1)과 큰 회전을 섞은 전진·후진을 받는다. 어느 것에도 안 맞으면 감시가 꺼진다
      # ("Velocity is not covered by any of the velocity polygons", 실기 2026-11-19 H: 회전 중 수백 번)
      velocity_polygons: ["translation_forward_high", "translation_forward_low", "translation_backward", "stopped", "rotating", "forward_turning", "backward_turning"]
      holonomic: false
      translation_forward_high:
        points: "[[2.5, 0.48], [2.5, -0.48], [-0.45, -0.48], [-0.45, 0.48]]" #"[[2.1675, 0.315], [2.1675, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.7
        linear_max: 1.5
        theta_min: -1.5
        theta_max: 1.5
      translation_forward_low:
        points: "[[1.5, 0.48], [1.5, -0.48], [-0.45, -0.48], [-0.45, 0.48]]" #"[[1.2, 0.315], [1.2, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.1
        linear_max: 0.699
        theta_min: -0.3
        theta_max: 0.3
      translation_backward:
        points: "[[0.45, 0.48], [0.45, -0.48], [-0.7, -0.48], [-0.7, 0.48]]" #"[[0.2, 0.315], [0.2, -0.315], [-0.6, -0.315], [-0.6, 0.315]]"
        linear_min: -0.4
        linear_max: -0.05
        theta_min: -0.5
        theta_max: 0.5
      stopped:
        points: "[[0.55, 0.5], [0.55, -0.5], [-0.55, -0.5], [-0.55, 0.5]]" #"[[0.5, 0.25], [0.5, -0.25], [-0.35, -0.25], [-0.35,  0.25]]"
        linear_min: 0.0
        linear_max: 0.0
        theta_min: -0.1
        theta_max: 0.1
      # 0.868 m 정사각형이 돌 때 모서리가 쓸고 가는 반경은 0.614 m 라 ±0.65 로 감싼다
      rotating:
        points: "[[0.65, 0.65], [0.65, -0.65], [-0.65, -0.65], [-0.65, 0.65]]"
        linear_min: -0.05
        linear_max: 0.1
        theta_min: -1.5
        theta_max: 1.5
      forward_turning:
        points: "[[1.5, 0.65], [1.5, -0.65], [-0.65, -0.65], [-0.65, 0.65]]"
        linear_min: 0.1
        linear_max: 1.5
        theta_min: -1.5
        theta_max: 1.5
      backward_turning:
        points: "[[0.65, 0.65], [0.65, -0.65], [-0.7, -0.65], [-0.7, 0.65]]"
        linear_min: -0.4
        linear_max: -0.05
        theta_min: -1.5
        theta_max: 1.5
    # H 브링업은 /scan·/scan_b 를 내지 않는다 (두 SICK 는 /scan_front·/scan_rear, 합친 결과는 /scan_merge).
    # 없는 토픽을 소스로 두면 "invalid source" 로 항상 정지 명령을 내 Nav2 가 움직이지 못한다 (MH 와 같은 문제)
    observation_sources: ["scan_merge"]
    scan_merge:
      type: "scan"
      topic: "/scan_merge"
      min_height: 0.15
      max_height: 2.0
      enabled: True


# 주행 런치(navigation_launch.py)는 모델과 관계없이 docking_server 를 띄운다. 이 블록이 없으면 configure 가
# "Charging dock plugins not given!" 으로 실패하고, lifecycle_manager_navigation 이 주행 노드 전체의 활성화를 멈춘다.
# MH 설정(전방 RealSense 태그 도킹, 실기 검증됨)을 바탕으로 했다. H 실기에서 아직 검증하지 않은 값은 "H 미검증"으로 표시했다
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    # 접근 중 태그를 끝내 못 찾으면 staging 으로 물러나 한 번 더 찾는다
    max_retries: 1

    base_frame: "base_link"
    fixed_frame: "odom"
    dock_prestaging_tolerance: 0.15
    dock_backwards: false

    # API 는 충전 도킹·언도킹을 tetra_charging_dock 으로, 태스크의 싣기(LOAD)·내리기(UNLOAD) 위치는 tetra_lift_load_dock·tetra_lift_unload_dock 으로
    # 요청한다 (도킹 인스턴스는 API 가 지도의 도킹·LOAD·UNLOAD 위치로 reload_database 한다)
    dock_plugins: ['tetra_charging_dock', 'tetra_lift_load_dock', 'tetra_lift_unload_dock']

    tetra_charging_dock:
      plugin: 'tetra_docking::TetraChargingDock'
      # 도크 자세 도착 판정 폭. 넓으면 충전기에 닿기 전에 "도착"으로 멈춰 접점이 안 붙는다 (MH 와 같음)
      docking_threshold: 0.005
      docked_by_depth: true
      staging_x_offset: -0.4
      staging_yaw_offset: 0.0
      use_battery_status: false
      use_stall_detection: false

      # 전방 RealSense D455(camera1) 컬러 영상의 36h11, 0.1 m 태그 (tetra_bringup_h.launch.py realsense_apriltag_node)
      use_external_detection_pose: true
      tag_tf_as_detection: true
      marker_family: "tag36h11:"
      camera_frame: "camera1_color_optical_frame"
      external_detection_timeout: 1.0
      # apriltag_ros 태그 프레임은 z 가 카메라 쪽을 향한다. Y 축 +90도로 도크 x 축을 태그 안쪽(-z)으로 돌린다 (MH·EDU 와 같음)
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: 0.0
      external_detection_rotation_yaw: 0.0
      # 태그면 -> 도킹을 마친 base_link 위치. 실측(2026-11-18): 충전 중 base_link-태그 0.725 m, 도킹 시험에서 접점이 0.717 m 에서 붙었다
      # (추정값 0.68 은 도크 자세가 충전기 안쪽 4 cm 라 접점이 먼저 붙어 끝났다). 미세 조정은 관리자 설정의 도킹 영점
      # H 기준값(2026-11-23, 관리자 도킹 영점 0/0/0 으로 정확히 붙은 상태에서 충전 접점 docking_status 3, 240 샘플 평균):
      #   도킹 완료 base_link -> 태그 x 0.718 m, y -0.025 m, z 0.139 m, 도크 축 각도 -0.88 deg.
      # 다른 H 는 이 파라미터와 영점 0 을 그대로 쓴다. 충전기·카메라 장착이 달라 어긋나면, 충전 중 같은 값을 재서
      # 기준값과의 차이만큼 관리자 설정의 도킹 영점(앞뒤·좌우 mm, 각도 deg)으로 맞춘다. 이 yaml 값은 바꾸지 않는다
      external_detection_translation_x: -0.72
      external_detection_translation_y: 0.0
      filter_coef: 0.1

      # tetra_power_driver 의 docking_status 가 이 값 이상이면 접점으로 본다 (모든 모델 같음)
      docking_status_topic: "docking_status"
      contact_status_val: 2
      charge_requires_contact: true
      blind_approach_distance: 0.25
      blind_approach_timeout: 8.0
      lost_tag_reacquire_distance: 1.0
      lost_tag_reacquire_time: 4.0
      tag_search_angle: 0.6
      tag_search_speed: 0.1
      # bumper_data 비트는 tetra_wheel_driver 기준 0x01 앞 범퍼, 0x08 뒤 범퍼 (MH 와 같은 드라이버). H 미검증
      bumper_topic: "bumper_data"
      bumper_mask: 1
      bumper_grace: 1.5
      undock_bumper_mask: 8
      heading_priority_near: 0.15
      heading_priority_far: 0.30

      tag_staging: true
      tag_staging_distance: 0.75
      tag_staging_distance_min: 0.45
      tag_staging_distance_max: 0.95
      camera_info_topic: "/camera1/color/camera_info"
      tag_size: 0.1

    # 리프트 포트: 로봇 앞쪽에 있는 ㄷ 자 받침대. 태그 대신 라이다(scan_merge)로 두 다리 안쪽 면을 찾아 그 사이로 곧게 들어가
    # 지도에 등록한 LOAD 위치(= 짐을 뜨는 자리, 포트 축 위)에 서면 리프트를 올린다 (tetra_util tetra_docking/src/lift_pocket.cpp).
    # 다리 사이에서는 도킹 서버 costmap 충돌 검사 대신 플러그인이 스캔으로 옆·앞 여유를 보고, 틀어진 채 입구를 넘으려 하면 멈춘다.
    # 포트 치수(pocket_inner_width·pocket_leg_length·pocket_insert_depth)는 현장 포트를 실측해 넣는다. 아래는 H 미검증 자리값이다
    tetra_lift_load_dock:
      plugin: 'tetra_docking::TetraLiftDock'
      detection_source: "lidar"
      pocket_scan_topic: "/scan_merge"
      pocket_frame: "odom"
      # 다리 안쪽 면 사이 간격 (m). 로봇 폭 0.868 m + 양옆 여유. 실측
      pocket_inner_width: 1.00
      # 다리 길이: 입구(다리 앞 끝)에서 안쪽 끝까지 (m). 실측
      pocket_leg_length: 1.00
      # 입구에서 짐을 뜨는 자리(base_link)까지 축 방향 거리 (m). 짐 가운데 아래에 로봇 리프트 가운데가 오게 실측
      pocket_insert_depth: 0.50
      # 등록 위치(AMCL) 기준 다리를 찾는 띠 반폭. 첫 검출은 이 두 배로 찾는다
      pocket_band_half_width: 0.10
      pocket_max_width_error: 0.06
      pocket_max_yaw_change: 0.35
      # 외곽 꼭짓점이 입구를 넘을 때 다리 안쪽 면까지 남아야 하는 거리. 모자라면 다리에 닿기 전에 멈춘다
      pocket_entry_margin: 0.03
      pocket_entry_lookahead: 0.03
      # 들어가는 동안 스캔 점과 외곽 사이 최소 여유 (옆·앞). 모자라면 멈춘다
      pocket_min_side_clearance: 0.03
      pocket_min_front_clearance: 0.05
      pocket_lost_timeout: 2.0
      pocket_filter_coef: 0.3
      # 외곽: local_costmap footprint 와 같다 (뒤 안테나 포함 -0.504)
      footprint_front: 0.434
      footprint_back: -0.504
      footprint_half_width: 0.434
      # 도착 판정: 포트 축 깊이가 insert_depth 에서 이 값 안이면 도착
      docking_threshold: 0.02
      # staging = 짐 뜨는 자리에서 1.4 m 뒤 (입구 앞 약 0.45 m 에서 축에 맞춰 곧게 들어간다). 언도킹도 그만큼 곧게 후진해 포트를 빠져나온다
      staging_x_offset: -1.4
      staging_yaw_offset: 0.0
      use_external_detection_pose: false
      # 보드 CN 코드(conveyor_auto_move_cmd): H 리프트는 2 가 최대 높이, 0 이 원점
      lift_action_mode: 2

    tetra_lift_unload_dock:
      plugin: 'tetra_docking::TetraLiftDock'
      detection_source: "lidar"
      pocket_scan_topic: "/scan_merge"
      pocket_frame: "odom"
      pocket_inner_width: 1.00
      pocket_leg_length: 1.00
      pocket_insert_depth: 0.50
      pocket_band_half_width: 0.10
      pocket_max_width_error: 0.06
      pocket_max_yaw_change: 0.35
      pocket_entry_margin: 0.03
      pocket_entry_lookahead: 0.03
      pocket_min_side_clearance: 0.03
      pocket_min_front_clearance: 0.05
      pocket_lost_timeout: 2.0
      pocket_filter_coef: 0.3
      footprint_front: 0.434
      footprint_back: -0.504
      footprint_half_width: 0.434
      docking_threshold: 0.02
      staging_x_offset: -1.4
      staging_yaw_offset: 0.0
      use_external_detection_pose: false
      lift_action_mode: 0

    controller:
      # 관제가 도킹 목표마다 관리자 설정(도킹 속도·감속 시작 거리)으로 v_linear_max·v_linear_min·slowdown_radius 를 덮어쓴다
      # (TetraSingleManagement lib/robot/services/dock-speed.ts). 여기 값은 관제 없이 도킹하거나 재시작 뒤 첫 언도킹에 쓴다
      k_phi: 5.0
      k_delta: 3.0
      v_linear_min: 0.0385
      v_linear_max: 0.10
      v_angular_max: 0.15
      slowdown_radius: 0.65

      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      # 도크 자세 이 거리 안에서는 costmap 충돌 검사를 하지 않는다. 충전기는 0.45 m 면 됐지만(MH 와 같음), 리프트 포트는
      # 로봇이 다리 사이로 들어가 다리가 inflation 안에 들어오므로 입구를 넘는 순간(로봇 중심이 짐 뜨는 자리에서
      # pocket_insert_depth + footprint_front 앞)부터 빼야 한다: 0.50 + 0.434 + 여유 0.1.
      # 그 안은 플러그인의 스캔 여유 검사(포트)·범퍼 정지(충전기)가 맡는다. Jazzy 는 실행 중 이 값을 못 바꿔 도크 종류마다 따로 둘 수 없다.
      # pocket_insert_depth 를 바꾸면 이 값도 같이 맞춘다
      dock_collision_threshold: 1.05
