amcl:
  ros__parameters:
    # use_sim_time 은 런치 인자(실로봇 False / 시뮬 True)가 정한다. params 파일 값이 런치의 -p 보다 우선해서(2026-11-19 확인)
    # 여기서 true 로 박아 두면 실로봇에서도 /clock 없이 sim time 으로 떠서 AMCL 시계가 0 에 머문다
    # 움직임 잡음 (Nav2 기본값). 0.1 이면 파티클이 바퀴 오도메트리의 실제 방향 오차만큼 퍼지지 않아
    # 틀린 자세에 몰린 뒤 빠져나오지 못했다 (M 실기 2026-11-19, amcl_localization_m.yaml)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.0
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.3
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.5 #2.0
    laser_max_range: 25.0 #100.0
    laser_min_range: -1.0
    # likelihood_field 는 빔 점수를 '더해서' 가중치를 만들어 방향 오차를 거의 구분하지 못한다. M 실기(2026-11-19)에서
    # 0.25 m·12° 틀린 자세와 바른 자세의 가중치 차이가 2.1 배(방향 5° 오차면 1.46 배)뿐이라 오도메트리 오차가 쌓였다.
    # _prob 는 빔 확률을 곱해서 같은 비교가 54 nats 로 벌어진다 (EDU·M 과 같은 설정)
    laser_model_type: "likelihood_field_prob"
    max_beams: 60
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.01
    pf_z: 0.99
    # 무작위 파티클 주입을 끈다 (Nav2 기본값 0.0/0.0). 켜 두면 사람이 지나가 점수가 잠깐 떨어질 때마다 지도 곳곳에 파티클을 뿌려
    # 위치가 튀었다 (EDU 2026-11-10, M 2026-11-19). 위치를 잃으면 auto_relocalizer(tetra_relocalization)가 바로잡는다
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2 #1.0
    update_min_a: 0.1 #0.2
    update_min_d: 0.15 #0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # H 브링업은 두 SICK 를 /scan_front·/scan_rear 로 내고 /scan_merge 로 합친다. /scan 발행자가 없어 AMCL 이 map TF 를 못 냈고
    # global_costmap 활성화가 시간 초과로 실패해 주행 전체가 멈췄다 (MH 와 같은 문제)
    scan_topic: scan_merge
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

      
