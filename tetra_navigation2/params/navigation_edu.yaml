bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # EDU 는 후방 센서가 없어 뒤를 보지 못한 채 후진하면 안 된다. Nav2 기본 BT 는 복구 단계에서 BackUp(0.3 m 후진)을 하므로
    # BackUp 만 뺀 EDU 전용 사본을 쓴다 (costmap 초기화·Spin·Wait 은 그대로)
    default_nav_to_pose_bt_xml: "$(find-pkg-share tetra_navigation2)/behavior_trees/navigate_to_pose_w_replanning_and_recovery_edu.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share tetra_navigation2)/behavior_trees/navigate_through_poses_w_replanning_and_recovery_edu.xml"
    use_feedback: true
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    odom_topic: /odometry/filtered

    # Progress checker parameters
    # 제자리 회전도 진행으로 친다 (PoseProgressChecker). SimpleProgressChecker 는 10초에 0.3 m 이동만 진행으로 봐서,
    # 목표 바로 앞(0.3 m 안)에서 방향을 맞추느라 돌거나 조금씩 움직이면 'Failed to make progress' 로 실패했고,
    # BT 복구가 Spin 을 시켜 목표 근처에서 계속 맴돌았다 (실기 2026-11-10 L4: 목표 0.14 m 앞에서 반복)
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.5
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      # ±1.6°(0.0274533)였을 때 RPP 제자리 회전(rotate_to_heading_angular_vel, 목표 근처에서도 줄지 않음)이
      # 제어 한 번에 그보다 더 돌아 허용 범위를 넘나들며 좌우로 맴돌았다 (실기 2026-11-10 13:38 도킹 staging 도착에 54초).
      # ±2.9° 면 위치 도착에 충분하고, 도킹은 staging 뒤 도킹 컨트롤러가 태그 기준으로 다시 맞춘다
      yaw_goal_tolerance: 0.05

    # Controller plugin (Regulated Pure Pursuit)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocity and Acceleration Limits
      desired_linear_vel: 0.8
      min_approach_linear_velocity: 0.05
      max_angular_vel: 0.8  # Allow sufficient angular velocity for tight turns
      max_angular_accel: 3.3

      # Lookahead Distance Configuration
      lookahead_dist: 0.8  # Adjust to balance between responsiveness and smoothness
      min_lookahead_dist: 0.5  # Large enough for the robot to navigate tight turns smoothly
      max_lookahead_dist: 1.5
      lookahead_time: 1.0   # Dynamic lookahead adjustment based on speed
      use_velocity_scaled_lookahead_dist: false

      # Rotate to Heading Configuration (Rotate in place before tracking path)
      # EDU 는 후방 센서가 없어 후진하면 안 된다. 경로가 뒤쪽이면 후진 대신 제자리 회전으로 방향을 맞춘다
      # (allow_reversing 과 use_rotate_to_heading 은 동시에 true 일 수 없다)
      allow_reversing: false
      use_rotate_to_heading: true
      # 0.785398 에서 줄였다: 20 Hz 제어 한 번에 1.4° 만 돌아 위 yaw_goal_tolerance(±2.9°) 안에 멈출 수 있다
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785398    # Rotate in place if heading error >= 45 degrees

      # Velocity Scaling and Safety Features
      use_cost_regulated_linear_velocity_scaling: true  # Auto-slowdown on sharp curves
      use_regulated_linear_velocity_scaling: true  # Auto-slowdown near obstacles
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.75

      # General & Collision Settings
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.2
      use_collision_detection: true
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.1675,0.215], [-0.318,0.215], [-0.318,-0.215], [0.1675,-0.215]]"

      # Active Costmap Layers
      # 가상벽은 라이다와 다른 레이어(virtual_wall_layer)에 둔다. 같은 레이어에서 clearing 하던 때는 매 주기마다
      # map 원점에서 벽 점(약 8만 개)마다 광선을 그어 CPU 를 썼다. 지운·바꾼 벽은 API 가 costmap 을 비워 없앤다
      plugins: ["obstacle_layer", "virtual_wall_layer", "inflation_layer"]

      # Inflation Layer Settings
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.58      # Distance to inflate costs around obstacles
        cost_scaling_factor: 1.75   # Exponential decay factor for inflation cost
      
      # Obstacle Layer Settings
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: points

        # 2D LiDAR Source (/points2)
        points:
          topic: /points2
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          clearing: True
          marking: True

      # Virtual Wall Layer (marking 만, 라이다와 분리)
      virtual_wall_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 로봇 아래 칸을 지우지 않는다: 위치가 틀어져 벽 안에 들어가면 그대로 보여야 출발 거부 이유가 맞다
        footprint_clearing_enabled: False
        observation_sources: virtual_obstacle_source
        virtual_obstacle_source:
          topic: /Local_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          # 표시 거리는 점 구름 원점(map 원점)에서 잰다. 지도 끝의 벽까지 닿게 넉넉히 둔다
          obstacle_max_range: 100.0

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Frame & Update Rates
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.5

      # Map Dimensions & Footprint
      resolution: 0.05
      width: 15   # Overridden dynamically by static map dimensions
      height: 15  # Overridden dynamically by static map dimensions
      footprint: "[[0.1675,0.215], [-0.318,0.215], [-0.318,-0.215], [0.1675,-0.215]]"
      track_unknown_space: true
      always_send_full_costmap: True

      # Active Costmap Layers
      # 가상벽 분리 이유는 local_costmap 주석 참고
      plugins: ["static_layer", "obstacle_layer", "virtual_wall_layer", "inflation_layer"]
      # 관제 API(TetraSingleManagement lib/robot/zones)가 보내는 PENALTY 구간("되도록 피함") 마스크.
      # 마스크 값(%)이 비용이 된다. 구간이 없으면 마스크가 0 이라 예전과 같다. 레이어가 아니라 filters 에 둔다 (모든 레이어 뒤에 적용)
      filters: ["zone_keepout_filter"]
      zone_keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

      # 1. Static Map Layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # 2. Obstacle Layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 소스 이름은 아래 정의(points)와 같아야 한다. 정의 없는 이름(points2)은 LaserScan 기본값으로 /points2 를 구독해 타입이 맞지 않아 전역 costmap 에 라이다 장애물이 빠졌다
        observation_sources: points
        # 2D LiDAR Source (/poinst2)
        points:
          topic: /points2
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True

      # 3. Virtual Wall Layer (marking 만, 라이다와 분리)
      virtual_wall_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: False
        observation_sources: virtual_obstacle_source
        virtual_obstacle_source:
          topic: /Global_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          obstacle_max_range: 100.0

      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7   # Kept moderate for optimal global path planning

map_server:
  ros__parameters:
    yaml_filename: ""

planner_server:
  ros__parameters:
    # Expected re-planning frequency (Hz)
    expected_planner_frequency: 15.0
    costmap_update_timeout: 1.0

    # Active Planner Plugins
    planner_plugins: ["GridBased"]

    # Global Planner Configuration (Navfn)
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5        # Goal search tolerance if exact goal is blocked (meters)
      use_astar: false      # Set to true to use A* instead of Dijkstra for faster search
      allow_unknown: true   # Allow paths to be planned through unknown space

smoother_server:
  ros__parameters:
    # Active Smoother Plugins
    smoother_plugins: ["simple_smoother"]

    # Simple Smoother Configuration
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10    #Convergence tolerance
      max_its: 1000         # Maximum optimization iterations
      do_refinement: True   # Perform path refinement post-smoothing for smoother tracking

behavior_server:
  ros__parameters:
    # Costmap & Footprint Topic Names
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    # Execution Frequency & TF Frames
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

    # Active Recovery Behavior Plugins
    # EDU 는 후방 센서가 없어 후진 복구를 쓰지 않는다. backup 은 항상 후진이고 drive_on_heading 도 음수 거리면 후진하므로 둘 다 뺀다
    # (EDU 전용 BT 에서도 BackUp 을 뺐다. 다시 넣으면 BT 가 /backup 액션 서버를 찾지 못해 실패한다)
    behavior_plugins: ["spin", "assisted_teleop", "wait"]
    
    # Plugin Declarations
    spin:
      plugin: "nav2_behaviors::Spin"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"

    # Safety & Physical Motion Limits for Recovery
    simulate_ahead_time: 2.0    # Lookahead time in seconds for collision checking
    max_rotational_vel: 1.0     # Max rotation speed during recovery (rad/s)
    min_rotational_vel: 0.1     # Min rotation speed during recovery (rad/s)
    rotational_acc_lim: 3.2     # Rotational acceleration limit (rad/s^2)

waypoint_follower:
  ros__parameters:
    # Execution Loop Rate & Failure Handling
    loop_rate: 20
    stop_on_failure: false   # Set to 'true' if the mission must abort when a waypoint is unreachable
    action_server_result_timeout: 900.0

    # Task Executor Plugin Settings (Task to perform upon reaching each waypoint)
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200  # Pause duration at each waypoint in milliseconds (e.g., 2000ms = 2 seconds)

velocity_smoother:
  ros__parameters:
    # Execution Frequency & Feedback Type
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"  # Options: "OPEN_LOOP", "CLOSED_LOOP", "DISABLED"

    # Odometry Topic (Used when feedback is set to CLOSED_LOOP)
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

    # Velocity Limits [x, y, theta]
    max_velocity: [2.0, 0.0, 2.0]
    # EDU 는 후방 센서가 없어 후진하면 안 된다. 컨트롤러·behavior_server 가 음수 x 를 내도 여기서 0 으로 잘라 마지막 방어선으로 둔다
    # (회전은 양방향 그대로 허용. docking_server 는 이 노드를 거치지 않는다)
    min_velocity: [0.0, 0.0, -2.0]

    # Acceleration & Deceleration Limits [x, y, theta]
    max_accel: [0.3, 0.0, 3.3]
    max_decel: [-0.3, 0.0, -3.3]

    # Deadband & Timeout
    deadband_velocity: [0.0, 0.0, 0.0]  # Minimum velocity threshold to output zero velocity
    velocity_timeout: 1.0               # Stop outputting velocity if no command is received for N seconds
    scale_velocities: False             # Set to 'true' to scale both linear & angular velocities proportionally

collision_monitor:
  ros__parameters:
    # Coordinate Frames
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    # Topic Pipeline: [Smoother Output] -> cmd_vel_in -> (Collision Monitor) -> cmd_vel_out -> [Motor Driver]
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav2"
    state_topic: "collision_monitor_state"

    # Timeouts and Corrections
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    # Active Polygons List (Order matters: Stop evaluated first, then Slowdown)
    polygons: ["VelocityPolygonSlowdown"]

    # [Polygon] Slowdown Warning Zone (Outer Footprint)
    VelocityPolygonSlowdown:
      type: "velocity_polygon"
      action_type: "slowdown"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_slow"
      velocity_polygons: ["slow_forward_high", "slow_forward_low", "slow_backward", "slow_idle"]
      holonomic: false

      slow_forward_high:
        points: "[[1.1675, 0.315], [1.1675, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.7
        linear_max: 1.5
        theta_min: -1.5
        theta_max: 1.5
      slow_forward_low:
        points: "[[0.5, 0.315], [0.5, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.3
        linear_max: 0.699
        theta_min: -1.5
        theta_max: 1.5
      slow_backward:
        points: "[[0.2, 0.315], [0.2, -0.315], [-0.6, -0.315], [-0.6, 0.315]]"
        linear_min: -1.0
        linear_max: -0.05
        theta_min: -1.5
        theta_max: 1.5
      slow_idle:
        points: "[[0.2, 0.25], [0.2, -0.25], [-0.35, -0.25], [-0.35,  0.25]]"
        linear_min: 0.0
        linear_max: 0.0
        theta_min: -1.5
        theta_max: 1.5

    # Active Sensor Observation Sources
    observation_sources: ["points"]
    points:
      type: "pointcloud" #PointCloud2
      topic: /points2
      min_height: 0.0
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    # Server Core Configuration
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    # 재시도는 staging 자세까지 후진한 뒤 다시 들어간다. EDU 는 후방 센서가 없어 재시도하지 않는다.
    # 실기 (2026-10-29 14:06) 재시도 후진이 staging 자세(허용 5 cm, 0.1 rad)에 들지 못해 30 초 동안 뒤로 움직이다 905 로 끝났다.
    # 실패하면 그 자리에 멈추고 API 가 이유를 웹에 알린다
    max_retries: 0

    # Frames & Topics
    base_frame: "base_link"
    fixed_frame: "odom"

    # 로봇이 staging 자세에서 이만큼(m + rad 합성 거리) 안이면 Nav2 주행 없이 바로 접근한다.
    # 0.5 면 축에서 0.3 m 벗어나 비스듬히 선 자리에서도 바로 접근해 도중에 태그를 놓쳤다.
    # 축 위에 이미 서 있으면 플러그인이 로봇 자세를 staging 으로 돌려줘 이 검사를 통과한다 (tag_staging_skip_*)
    dock_prestaging_tolerance: 0.15
    # EDU 는 전방 RealSense 로 태그를 보며 앞으로 도킹한다 (웹 옵션 docking_front: 1, 예전 EDU 도 전방 도킹)
    dock_backwards: false

    # API 는 충전 도킹을 tetra_charging_dock 으로 요청하고 언도킹도 이 유형으로 보낸다.
    # 도킹 인스턴스는 API 가 지도의 도킹 위치로 reload_database 한다 (도킹 위치가 없으면 API 가 태그 검출만으로 도킹한다)
    # tetra_backoff_dock 은 언도킹 전용이다 (API 가 출발 전에 태그가 정면 가까이 보이면 이 유형으로 UndockRobot 을 보낸다)
    dock_plugins: ['tetra_charging_dock', 'tetra_backoff_dock']

    tetra_charging_dock:
      plugin: 'tetra_docking::TetraChargingDock'
      # 도킹 완료는 접점(docking_status >= 2)으로 판정한다. 자세 판정(도크 자세 ± docking_threshold)이 먼저 걸리면
      # 접점 없이 성공으로 끝나므로 (실측 -0.40 에서 그랬다) 도크 자세는 접점보다 약간 안쪽에 두고 판정 거리는 좁힌다.
      # 실측 (2026-10-29) 접점은 base_link-태그 거리 약 0.39~0.40 m 에서 붙는다. 자세 판정은 0.37 m 라 접점이 안 잡혀도 2 cm 안에서 멈춘다
      docking_threshold: 0.03
      # undock 과 재시도는 이 거리만큼 후진한다. 후방 센서가 없어 짧게 둔다 (staging 에서 카메라-태그 약 0.7 m 라 검출에 충분)
      staging_x_offset: -0.4
      staging_yaw_offset: 0.0
      use_battery_status: false
      use_stall_detection: false

      # apriltag 노드의 태그 TF (camera1_color_optical_frame 기준)를 검출 자세로 쓴다
      use_external_detection_pose: true
      tag_tf_as_detection: true
      marker_family: "tag36h11:"
      camera_frame: "camera1_color_optical_frame"
      # 1.0 에서 늘렸다: 컬러 영상이 실측 9 fps 라 접근 중 몇 프레임만 놓쳐도 1초를 넘겨, 태그가 화면 안에 있는데도
      # 도크 0.5 m 앞에서 'Dock tag lost' 로 실패했다 (실기 2026-11-10 3건). 마지막 검출 자세는 odom 기준이라 2초는 버틴다
      external_detection_timeout: 2.0
      # apriltag_ros 태그 프레임은 z 가 카메라 쪽을 향한다. Y 축 +90도로 도크 x 축을 태그 안쪽(-z)으로 돌린다.
      # (nova_carter 기본값 -1.57/-1.57 은 z 가 태그 안쪽인 Isaac 규약이라 도크가 180도 뒤집힌다)
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: 0.0
      external_detection_rotation_yaw: 0.0
      # 태그면 -> 도킹을 마친 base_link 위치 (위 실측 참고)
      external_detection_translation_x: -0.34
      external_detection_translation_y: 0.0
      filter_coef: 0.1

      docking_status_topic: "docking_status"
      contact_status_val: 2
      # 스테이션 전원이 꺼져 접점 신호가 없으면 자세 도착만으로 성공 처리하지 않는다 (wait_charge_timeout 뒤 906)
      charge_requires_contact: true
      # 실기 (14:06, 14:08) 접근 3~4.5 초 만에 검출이 끊겨(Failed dock detection) 재시도 후진으로 넘어갔다.
      # 카메라(약 0.23 m 높이, 세로 화각 약 42도)는 계산상 접점 10~15 cm 전부터 아래쪽 태그를 시야 밖으로 놓친다.
      # 마지막 검출 도크 자세까지 0.25 m 안에서 놓쳤을 때만 odom 으로 마저 들어간다. 더 멀리서 놓치면 904 로 멈춘다
      blind_approach_distance: 0.25
      blind_approach_timeout: 8.0
      # 실기 (2026-10-29 15:54, 16:03) 비스듬히 들어가 접점보다 앞 범퍼가 먼저 닿았는데, 구동 보드는 앞 범퍼만으로는
      # 서보를 끄지 않아 제어 법칙이 14~20 초 동안 계속 밀었다. 접점 없이 앞 범퍼(0x01)가 bumper_grace 넘게 눌리면 멈추고
      # 905 로 끝낸다 (API 가 범퍼 눌림을 보고 웹에 이유를 알린다).
      # 곧게 들어가도 범퍼는 접점과 거의 같은 거리(base_link-태그 0.40 m)에서 닿고, docking_status 는 그 뒤 약 0.5 초에 온다
      # (실측 16:21·16:32, 축에서 1~2 cm). 그래서 바로 멈추지 않고 1.5 초(접점 지연의 3 배) 기다린다
      bumper_topic: "bumper_data"
      bumper_mask: 1
      bumper_grace: 1.5
      # 마지막 구간 heading 우선: 도크 자세 0.30 m 앞부터 제어 목표를 로봇 횡 위치로 점점 옮겨 0.15 m 안에서는 도크와 나란히 곧게 들어간다.
      # 제어 목표가 접점보다 약 0.3 m 안쪽이라, 끝까지 횡 오차를 줄이려 하면 검출 흔들림 1 cm 가 접촉 때 heading 5~9도가 된다
      # (실기 16:20 축 1 cm 안에서 -4도 -> +5.3도로 꺾여 범퍼가 먼저 닿음). 시뮬레이션(검출 잡음 1 cm, 1도): 접촉 heading 최대 5.5도 -> 0.9도,
      # 대신 남는 횡 오차가 최대 0.8 cm -> 2.4 cm (실측 접점은 축에서 2.3 cm 에서도 붙었다)
      heading_priority_near: 0.15
      heading_priority_far: 0.30

      # 태그 정렬 staging: 도킹 시작 때 태그가 보이면 0.6 초 동안의 검출 평균으로 도크 자세를 구하고,
      # 태그 정면 축 위 tag_staging_distance 지점(태그를 마주 봄)으로 Nav2 주행한 뒤 직선으로 접근한다.
      # 태그가 안 보이면 목표 도크 자세(등록된 도킹 위치)로 staging 한다. 언도킹·재시도 후진 거리는 staging_x_offset 그대로다.
      # 0.6 m: 카메라-태그 약 0.83 m, 태그 폭 약 74 px (fx 609, 0.1 m 태그, 실측 태그 중심 base_link 위 0.15 m).
      # 축 위에서 곧게 접근하면 도크 자세까지 태그 전체가 영상 안이다. 대신 컬러 센서가 왼쪽 0.045 m 라 태그가 영상 오른쪽에 있고,
      # 남는 수평 여유각이 staging 21도, 카메라-태그 0.3 m 에서 10도로 준다. 비스듬히 시작해 제어 법칙이 크게 꺾으면
      # 이 여유를 넘어 태그가 옆으로 빠진다. 그래서 축 위 staging 에서 시작하고, 그래도 놓치면 blind_approach_distance 가 마무리한다.
      # 카메라 정보가 있으면 실제 태그 높이·카메라 TF(컬러 센서 옆 오프셋 포함)로 이 값을 검사·조정한다
      tag_staging: true
      # 0.75 m (카메라-태그 약 0.98 m, 태그 약 62 px): Nav2 staging 도착 허용(xy 0.1 m)과 AMCL 흔들림으로 축에서
      # 10~15 cm 벗어나 시작해도 접촉 전에 축으로 들어올 거리를 준다 (아래 controller 이득과 함께 시뮬레이션: 10 cm 에서 접촉 heading 1.7도)
      tag_staging_distance: 0.75
      tag_staging_distance_min: 0.45
      tag_staging_distance_max: 0.95
      camera_info_topic: "/camera1/color/camera_info"
      tag_size: 0.1

    # 언도킹 전용: 접점이 없어도 카메라 정면 0.6 m 안에 태그가 보이면 0.3 m 만 천천히 후진한다 (후방 센서 없음)
    tetra_backoff_dock:
      plugin: 'tetra_docking::TetraChargingDock'
      staging_x_offset: -0.3
      staging_yaw_offset: 0.0
      use_battery_status: false
      use_stall_detection: false
      use_external_detection_pose: false
      marker_family: "tag36h11:"
      camera_frame: "camera1_color_optical_frame"
      docking_status_topic: "docking_status"
      contact_status_val: 2
      charge_requires_contact: true
      undock_tag_distance: 0.6
      undock_tag_lateral: 0.2

    # Docking Controller
    controller:
      # 접근 속도 v = clamp(v_linear_max * r / slowdown_radius, v_linear_min, v_linear_max), r = 도크 자세까지 남은 거리 + 0.25 m
      # (도킹 서버가 제어 목표를 도크 자세 0.25 m 안쪽에 둔다). 0.65 면 도크 0.4 m 앞부터 줄여 약 0.04 m/s 로 닿는다
      # (예전 0.45 / 0.05: 0.2 m 앞부터 줄다가 0.056 m/s 로 닿았다). 곡선 모양(k_phi·k_delta)은 속도와 상관없다.
      # 관제가 도킹 목표마다 관리자 설정(도킹 속도·감속 시작 거리)으로 v_linear_max·v_linear_min·slowdown_radius 를 덮어쓴다
      # (TetraSingleManagement lib/robot/services/dock-speed.ts). 여기 값은 관제 없이 도킹하거나 재시작 뒤 첫 언도킹에 쓴다
      # 제어 목표는 도크 자세보다 0.25 m 안쪽이라, 횡 오차는 목표에 가서야 0 이 되고 접점 위치(목표 0.31 m 앞)에서는 아직 비스듬하다.
      # 3.0/2.0 은 staging 에서 10 cm 벗어나 시작하면 접촉 때 heading 약 7도 (실기 15:54 범퍼 충돌 때 8.9도, 축에서 2.7 cm).
      # 5.0/3.0 은 축으로 먼저 들어온 뒤 곧게 간다. 더 키우면 축으로 꺾을 때 태그가 영상 오른쪽 밖으로 나간다 (8.0/4.0: 15 cm 에서 시야 밖)
      k_phi: 5.0
      k_delta: 3.0
      v_linear_min: 0.0385
      # 언도킹 후진도 이 속도를 쓴다. 후방 센서가 없어 느리게 둔다
      v_linear_max: 0.10
      v_angular_max: 0.15
      slowdown_radius: 0.65

      # Collision Avoidance during Docking
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      # 도크 상자(높이 약 0.2 m)가 depth 장애물로 잡힌다. 목표가 0.25 m 더 안쪽으로 투영되므로 접촉 직전 자세까지 검사에서 뺀다
      dock_collision_threshold: 0.45
