bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 2000
    wait_for_service_timeout: 10000
    action_server_result_timeout: 9000.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.6 #1.0
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05 #0.25
      yaw_goal_tolerance: 0.0174533 #0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.8
      inflation_cost_scaling_factor: 1.75 #3.0
      lookahead_dist: 0.9 #1.0 #0.6  # Adjust to balance between responsiveness and smoothness
      lookahead_time: 1.0 #1.2  # Dynamic lookahead adjustment based on speed
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_vel: 1.0 #1.2  # Allow sufficient angular velocity for tight turns
      max_anguler_accel: 3.0
      max_lookahead_dist: 1.5
      min_lookahead_dist: 0.5  # Large enough for the robot to navigate tight turns smoothly
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.05 #0.0
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_heading_angular_vel: 0.785398
      rotate_to_heading_min_angle: 0.785398
      transform_tolerance: 0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true  # Use costmap values for speed scaling
      use_interpolation: true #false
      use_regulated_linear_velocity_scaling: true  # Slow down near obstacles
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0 #10.0
      publish_frequency: 15.0 #10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.219575,0.245], [-0.3955,0.245], [-0.3955,-0.245], [0.219575,-0.245]]"
      plugins: ["obstacle_layer", "stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.58 #1.0
        cost_scaling_factor: 1.75 #3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan scan2 virtual_obstacle_source sonar_dl_source sonar_rl_source sonar_rr_source sonar_dr_source
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 2.0
          raytrace_max_range: 3.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
        virtual_obstacle_source:
          topic: /Local_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
        sonar_dl_source:
          topic: /range_points_dl
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
        sonar_rl_source:
          topic: /range_points_rl
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
        sonar_rr_source:
          topic: /range_points_rr
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
        sonar_dr_source:
          topic: /range_points_dr
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 2.0 #1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 2
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true #false
        transform_tolerance: 0.2 #1.0
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud
        pointcloud:
          data_type: "PointCloud2"
          topic: /camera1/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 2.5
          min_obstacle_height: 0.03
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0 # 0.7
          min_z: 0.03
          vertical_fov_angle: 1.01229 #0.7
          horizontal_fov_angle: 1.51844 #1.20428
          decay_acceleration: 2.0 #1.0
          model_type: 0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 5.0 #10.0
      publish_frequency: 5.0 #10.0
      width: 15
      height: 15
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.219575,0.245], [-0.3955,0.245], [-0.3955,-0.245], [0.219575,-0.245]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 관제 API(TetraSingleManagement lib/robot/zones)가 보내는 PENALTY 구간("되도록 피함") 마스크.
      # 마스크 값(%)이 비용이 된다. 구간이 없으면 마스크가 0 이라 예전과 같다. 레이어가 아니라 filters 에 둔다 (모든 레이어 뒤에 적용)
      filters: ["zone_keepout_filter"]
      zone_keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: virtual_obstacle_source scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        virtual_obstacle_source:
          topic: /Global_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

map_server:
  ros__parameters:
    yaml_filename: "" #"office.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint #base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 2.0]
    min_velocity: [-2.0, 0.0, -2.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav2"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    polygons: ["VelocityPolygonStop"]
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "slowdown" #"stop"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_slow"
      velocity_polygons: ["rotation", "translation_forward_high", "translation_forward_low", "translation_backward", "stopped"]
      holonomic: false
      #slowdown_ratio: 0.4
      rotation:
        points: "[[0.249575, 0.285], [0.249575, -0.285], [-0.4, -0.285], [-0.4, 0.285]]"
        linear_min: 0.0
        linear_max: 0.05
        theta_min: -1.5
        theta_max: 1.5
      translation_forward_high:
        points: "[[1.3, 0.35], [1.3, -0.35], [-0.4, -0.35], [-0.4, 0.35]]"
        linear_min: 0.7
        linear_max: 1.5
        theta_min: -1.5
        theta_max: 1.5
      translation_forward_low:
        points: "[[0.8, 0.35], [0.8, -0.35], [-0.4, -0.35], [-0.4, 0.35]]"
        linear_min: 0.4
        linear_max: 0.699
        theta_min: -1.5
        theta_max: 1.5
      translation_backward:
        points: "[[0.2, 0.285], [0.2, -0.285], [-0.5, -0.285], [-0.5, 0.285]]"
        linear_min: -0.5
        linear_max: 0.0
        theta_min: -1.5
        theta_max: 1.5
      stopped:
        points: "[[0.249575, 0.285], [0.249575, -0.285], [-0.4, -0.285], [-0.4, 0.285]]"
        linear_min: -0.8
        linear_max: 0.8
        theta_min: -1.5
        theta_max: 1.5
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    # 태그 탐색(+-20도 왕복, 약 28초)이 끝날 만큼 기다린다
    initial_perception_timeout: 35.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    # 재시도 때 Jazzy 는 항상 전진으로 staging 을 찾아가, 목표가 옆·뒤면 제자리에서 70~95도 돌았다 (좁은 도크 자리에서 위험)
    # 접근 중 태그를 끝내 못 찾으면 staging 으로 물러나 한 번 더 찾는다 (MH 실기 2026-11-18: 0 이라 한 번 놓치면 바로 실패)
    max_retries: 1
    base_frame: "base_footprint"
    fixed_frame: "odom"
    # M 은 후방 카메라로 마커를 보며 뒤로 도킹한다 (웹 옵션 docking_front: 0 과 맞춘다).
    # Jazzy 는 방향을 서버에서 정하므로 모든 도킹 플러그인의 staging 자세도 도크를 등지도록 staging_yaw_offset 을 pi 로 둔다
    dock_backwards: true
    # 후면 카메라 화각이 좌우 약 20도라, 축에서 벗어난 채 접근하면 바로잡느라 돌다가 태그를 놓친다.
    # 0.5 이면 축에서 7 cm, 9 도 벗어난 자리에서도 staging 주행을 건너뛰었다 (l2Norm 은 x, y, yaw 를 함께 본다)
    dock_prestaging_tolerance: 0.05

    # Types of docks
    # API 는 tetra_charging_dock / tetra_lift_* 로 도킹을 요청한다 (도킹 인스턴스는 API 가 DB 도킹 위치로 reload_database 한다)
    dock_plugins: ['simple_charging_dock', 'tetra_charging_dock', 'tetra_lift_load_dock', 'tetra_lift_unload_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      staging_yaw_offset: 3.14159
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # M 은 뒤로 도킹한다 (dock_backwards, 후면 usb_cam "camera"). 도크 yaw 는 충전기 안쪽을 향하고
    # staging_yaw_offset pi 로 로봇이 충전기를 등지고 선다.
    # 예전에는 태그 프레임 자세를 그대로 도크 자세로 써서 목표 yaw 가 약 100도 틀어졌고, 휘는 접근 궤적이
    # 충전기 몸체에 걸려 매번 905(충돌)로 멈췄다 (2026-11-10 실기).
    tetra_charging_dock:
      plugin: 'tetra_docking::TetraChargingDock'
      # 자세 기준 도착(도크 자세까지 이 거리 안)이 접점보다 먼저 오면 접점 없이 멈춰 충전 실패로 끝난다
      docking_threshold: 0.01
      staging_x_offset: -0.7
      staging_yaw_offset: 3.14159
      use_battery_status: false
      use_stall_detection: false

      use_external_detection_pose: true
      tag_tf_as_detection: true
      marker_family: "tag36h11:"
      camera_frame: "camera"
      external_detection_timeout: 1.0
      # 태그 z 축(로봇 쪽)의 반대 = 충전기 안쪽을 도크 yaw 로 쓴다
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: 0.0
      external_detection_rotation_yaw: 0.0
      # 접점에 닿았을 때 base_footprint→태그 0.711 m (실측 2026-11-10, 좌우 -3 mm, 법선 -1.4도).
      # 도크 자세를 2 cm 깊게 두어 자세 기준 도착보다 접점이 먼저 닿게 한다
      external_detection_translation_x: -0.69
      external_detection_translation_y: 0.0
      filter_coef: 0.1

      docking_status_topic: "docking_status"
      contact_status_val: 2
      charge_requires_contact: true
      blind_approach_distance: 0.25
      blind_approach_timeout: 8.0
      # 비스듬히 접근하다 태그를 놓치면 이 거리 안에서는 마지막 태그 위치 쪽으로 몰아 다시 찾는다 (후면 카메라 화각 +-20 도로 좁음: 다시 찾는 거리를 줄임 (탐색은 이미 켜져 있음))
      lost_tag_reacquire_distance: 0.8
      lost_tag_reacquire_time: 4.0
      # 도킹은 후진이라 뒤 범퍼(0x08), 언도킹은 전진이라 앞 범퍼(0x01)를 본다
      bumper_topic: "bumper_data"
      bumper_mask: 8
      bumper_grace: 1.5
      undock_bumper_mask: 1
      heading_priority_near: 0.15
      heading_priority_far: 0.30

      tag_staging: true
      tag_staging_distance: 0.7
      tag_staging_distance_min: 0.5
      tag_staging_distance_max: 1.0
      tag_staging_skip_lateral: 0.02
      tag_staging_skip_yaw: 0.03
      # 작은 태그는 움직이는 동안 yaw 가 프레임마다 15 도씩 튀어, 멈춰서 평균한 staging yaw 를 접근 내내 쓴다
      lock_dock_yaw_to_staging: true
      # map 은 AMCL 이 움직일 때마다 보정해 staging 이 태그 축에서 벗어났다. odom 기준으로 낸다
      tag_staging_frame: "odom"
      # staging 에 왔는데 태그가 시야 밖이면 제자리에서 +-20도를 0.05 rad/s 로 돌며 찾는다 (AMCL 방향 오차 대비)
      tag_search_angle: 0.35
      tag_search_speed: 0.05
      camera_info_topic: "/camera/camera_info"
      tag_size: 0.1

    tetra_lift_load_dock:
      plugin: 'tetra_docking::TetraLiftDock'
      docking_threshold: 0.30
      staging_x_offset: -1.5
      staging_yaw_offset: 3.14159
      use_external_detection_pose: true
      marker_family: "tag36h11:"
      camera_frame: "camera"
      # 보드 CN 코드(conveyor_auto_move_cmd): 1 올림, 0 내림. H 리프트는 2 가 최대 높이
      lift_action_mode: 1
      filter_coef: 0.1

    tetra_lift_unload_dock:
      plugin: 'tetra_docking::TetraLiftDock'
      docking_threshold: 0.30
      staging_x_offset: -1.5
      staging_yaw_offset: 3.14159
      use_external_detection_pose: true
      marker_family: "tag36h11:"
      camera_frame: "camera"
      lift_action_mode: 0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      # 접근 속도 v = clamp(v_linear_max * r / slowdown_radius, v_linear_min, v_linear_max), r = 도크 자세까지 남은 거리 + 0.25 m
      # (도킹 서버가 제어 목표를 도크 자세 0.25 m 안쪽에 둔다). 0.65 면 도크 0.4 m 앞부터 줄여 약 0.04 m/s 로 닿는다
      # (예전 0.45 / 0.05: 0.2 m 앞부터 줄다가 0.056 m/s 로 닿았다). 곡선 모양(k_phi·k_delta)은 속도와 상관없다.
      # 관제가 도킹 목표마다 관리자 설정(도킹 속도·감속 시작 거리)으로 v_linear_max·v_linear_min·slowdown_radius 를 덮어쓴다
      # (TetraSingleManagement lib/robot/services/dock-speed.ts). 여기 값은 관제 없이 도킹하거나 재시작 뒤 첫 언도킹에 쓴다
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.0385
      v_linear_max: 0.10
      # 후면 usb_cam 은 어두우면 약 8 fps 로 떨어져 노출이 길다. 0.15 rad/s 로 돌면 영상이 번져 태그를 1초 넘게 놓쳤고(904),
      # 0.05 rad/s 에서는 매 프레임 검출됐다 (2026-11-10 실기)
      v_angular_max: 0.06
      slowdown_radius: 0.65

      # 기본값(5초 투영, 도크 0.3 m 안만 제외)은 충전기 몸체를 충돌로 본다
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      # 제어 목표는 도크 자세보다 0.25 m 깊다 (Jazzy docking_server backward_projection). 0.45 면 도크 앞 0.2 m 만 빠져
      # 접점 0.24 m 전에 충전기 몸체를 충돌로 보고 멈췄다 (2026-11-10 실기).
      # 0.75 면 staging(0.7 m) 출발점은 제어 목표에서 0.95 m 라 검사에 들어가, 옆벽 0.27 m 인 도크 자리에서 초음파가 발자국
      # 바로 옆에 남긴 옛 표시 하나로 출발하자마자 905 로 멈췄다 (2026-11-19 실기). staging 부터 도크까지(0.95 m)를 빼고,
      # 이 구간은 0.1 m/s 이하 후진 + 뒤 범퍼 정지(bumper_mask 8)로 막는다. 도킹 cmd_vel 은 collision_monitor 를 거치지 않는다
      dock_collision_threshold: 1.0
