bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 60 #20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      bt_xml_filename: "/home/tetra/ros2_ws/src/tetra_navigation2/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      bt_xml_filename: "/home/tetra/ros2_ws/src/tetra_navigation2/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    use_feedback: true
    
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    current_goal_checker: "general_goal_checker"
    current_progress_checker: "progress_checker"
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    odom_topic: /odometry/filtered
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3 #0.6 #1.0
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1 #0.25
      yaw_goal_tolerance: 0.0274533 #0.0349066 #0.0872665
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      # 관제가 Nav2 가 뜰 때 관리자 설정 base_speed(이 로봇 0.4)로 덮어쓴다. 관제 없이 뜨거나 덮어쓰기 전에는 이 값으로 달리므로 같게 둔다
      desired_linear_vel: 0.4
      inflation_cost_scaling_factor: 1.75 #3.0
      lookahead_dist: 0.8  # Adjust to balance between responsiveness and smoothness
      lookahead_time: 1.0 #1.2  # Dynamic lookahead adjustment based on speed
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 3.3
      max_lookahead_dist: 1.5
      min_lookahead_dist: 0.5  # Large enough for the robot to navigate tight turns smoothly
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.05 #0.0
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_heading_angular_vel: 0.785398
      rotate_to_heading_min_angle: 0.785398
      transform_tolerance: 0.2 #0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true  # Use costmap values for speed scaling
      use_interpolation: true #false
      use_regulated_linear_velocity_scaling: true  # Slow down near obstacles
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false #false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0 #10.0
      publish_frequency: 15.0 #10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10 #8
      height: 10 #8
      resolution: 0.05
      footprint: "[[0.4, 0.29], [0.4, -0.29], [-0.4, -0.29], [-0.4, 0.29]]"
      # stvl_layer 는 뺐다: MH 2D 구성에는 /livox/lidar 도, RealSense 점구름(/camera1/depth/color/points)도 발행되지 않아 입력이 없다
      # (설정 블록은 RealSense 점구름을 켤 때 다시 쓰도록 남긴다)
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # RPP 의 비용 감속은 발자국에서 cost_scaling_dist(0.45 m)까지만 본다 (내접 0.29 + 0.45 = 0.74 m 안쪽 비용만 쓰임).
        # 1.0 m 안의 비용 값은 2.58 일 때와 같고, costmap 갱신 CPU 가 약 26 % 준다 (격리 도메인 재생 실험)
        inflation_radius: 1.0
        cost_scaling_factor: 1.75 #3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 앞(scan=/scan_filtered_1)·뒤(scan2=/scan_filtered_2) SICK 둘 다. 예전 scan_b 는 정의가 없어 없는 토픽 /scan_b 를 구독했고
        # 뒤 라이다가 지역 costmap 에 빠져 BackUp·Spin·언도킹 충돌 검사가 뒤쪽 112도를 보지 못했다
        observation_sources: scan scan2 virtual_obstacle_source
        scan:
          topic: /scan_filtered_1 #/scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
        scan2:
          topic: /scan_filtered_2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
        virtual_obstacle_source:
          topic: /Local_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          # 가상벽 점구름은 map 프레임이라 센서 원점이 지도 원점이다. clearing 이면 지도 원점에서 벽 점마다 광선을 그어
          # 그 길의 라이다 장애물을 지우고, 창 밖이면 "Sensor origin ... out of map bounds" 를 하루 수만 번 낸다. 벽은 표시만 한다
          clearing: False
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0 #2.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15.0
        mark_threshold: 2
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true #false
        transform_tolerance: 0.1 #0.2 #1.0
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_cloud #realsense_cloud
        realsense_cloud:
          data_type: "PointCloud2"
          topic: /camera1/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 2.0
          min_obstacle_height: 0.1 #0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0 # 0.7
          min_z: 0.1
          vertical_fov_angle: 1.01229 #0.7
          horizontal_fov_angle: 1.51844 #1.20428
          decay_acceleration: 2.0 #1.0
          model_type: 0
        livox_cloud:
          data_type: "PointCloud2"
          topic: /livox/lidar
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel" #"passthrough"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0 # 0.7
          min_z: 0.1
          vertical_fov_angle: 0.907571 #52deg
          horizontal_fov_angle: 6.28319 #360deg
          decay_acceleration: 0.0 #1.0
          model_type: 0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 5.0 #10.0
      publish_frequency: 5.0 #10.0
      width: 15
      height: 15
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.4, 0.29], [0.4, -0.29], [-0.4, -0.29], [-0.4, 0.29]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 관제 API(TetraSingleManagement lib/robot/zones)가 보내는 PENALTY 구간("되도록 피함") 마스크.
      # 마스크 값(%)이 비용이 된다. 구간이 없으면 마스크가 0 이라 예전과 같다. 레이어가 아니라 filters 에 둔다 (모든 레이어 뒤에 적용)
      filters: ["zone_keepout_filter"]
      zone_keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: virtual_obstacle_source scan
        scan:
          topic: /scan_merge #/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
        virtual_obstacle_source:
          topic: /Global_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          # 지역 costmap 의 virtual_obstacle_source 와 같은 이유로 지우지 않는다
          clearing: False
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

map_server:
  ros__parameters:
    yaml_filename: "" #"office.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 15.0 #20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint #base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 2.0]
    min_velocity: [-2.0, 0.0, -2.0]
    max_accel: [0.3, 0.0, 3.3] # [3.5, 0.0, 3.5]
    # RPP 충돌 감지(1.0 s 앞)로 멈출 때 감속은 이 값이 정한다. -0.3 이면 0.4 m/s 에서 감속 0.27 m + 지연(최악 0.29 s)·보드 램프 0.12 m = 0.39 m 로
    # 감지 거리 0.4 m 를 거의 다 쓰고, 0.45 m/s 이상에서는 넘는다. -0.6 이면 0.4 m/s 에서 0.26 m, 안전 상한 0.83 m/s (예전 0.41 m/s).
    # 휠 드라이버는 정지 명령을 1.5 m/s^2 로 줄이므로 -0.6 도 하드웨어 한계 안이다. 가속은 그대로 둔다
    max_decel: [-0.6, 0.0, -3.3] # [-3.5, 0.0, -3.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav2"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    # 예전에는 "VelocityPolygonStop" 하나가 action_type slowdown(50 %)이라 라이다로는 한 번도 서지 않았고,
    # 속도 범위가 제자리 회전·0.1 m/s 미만·회전하며 전진을 덮지 않아 "Velocity is not covered" 가 하루 3,800~10,000 번 났다.
    # 정지 다각형(짧게)과 감속 다각형(예전 크기)을 나누고, 두 쪽 모두 velocity_smoother 출력 범위(+-2.0)를 빈틈없이 덮는다.
    # 정지 다각형 앞 끝 = 범퍼 0.4 m + 최악 정지거리 + 0.1 m 여유. 최악 정지거리 = v*0.238 s(스캔 주기 67 + /scan_merge 지연 88
    # + 입력 대기 50 + 휠드라이버 33 ms) + v^2/(2*1.5 m/s^2, 휠드라이버 정지 램프) + v*0.025 s(보드 램프 50 ms):
    #   v 0.45 -> 0.19 m (앞 끝 0.70), v 1.0 -> 0.60 m (앞 끝 1.10), 후진 0.3 -> 0.11 m (뒤 끝 -0.60)
    # 제자리 회전: 발자국 꼭짓점 반경 0.494 m + 2.6 cm. 도킹·언도킹은 docking_server 가 cmd_vel_nav2 로 바로 보내 이 다각형을 거치지 않는다.
    polygons: ["VelocityPolygonStop", "VelocityPolygonSlow"]
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_stop"
      velocity_polygons: ["rotation", "forward_slow", "forward_fast", "backward"]
      holonomic: false
      rotation:
        points: "[[0.52, 0.215], [0.215, 0.52], [-0.215, 0.52], [-0.52, 0.215], [-0.52, -0.215], [-0.215, -0.52], [0.215, -0.52], [0.52, -0.215]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -2.0
        theta_max: 2.0
      forward_slow:
        points: "[[0.70, 0.315], [0.70, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.02
        linear_max: 0.45
        theta_min: -2.0
        theta_max: 2.0
      forward_fast:
        points: "[[1.10, 0.315], [1.10, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.45
        linear_max: 2.0
        theta_min: -2.0
        theta_max: 2.0
      backward:
        points: "[[0.32, 0.315], [0.32, -0.315], [-0.60, -0.315], [-0.60, 0.315]]"
        linear_min: -2.0
        linear_max: -0.02
        theta_min: -2.0
        theta_max: 2.0
    # 예전 다각형(감속 50 %) 크기는 그대로 두고 속도 범위만 빈틈없이 넓혔다
    VelocityPolygonSlow:
      type: "velocity_polygon"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_slow"
      velocity_polygons: ["rotation", "translation_forward_low", "translation_forward_high", "translation_backward"]
      holonomic: false
      rotation:
        points: "[[0.65, 0.27], [0.27, 0.65], [-0.27, 0.65], [-0.65, 0.27], [-0.65, -0.27], [-0.27, -0.65], [0.27, -0.65], [0.65, -0.27]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -2.0
        theta_max: 2.0
      translation_forward_low:
        points: "[[1.2, 0.315], [1.2, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.02
        linear_max: 0.7
        theta_min: -2.0
        theta_max: 2.0
      translation_forward_high:
        points: "[[2.1675, 0.315], [2.1675, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.7
        linear_max: 2.0
        theta_min: -2.0
        theta_max: 2.0
      translation_backward:
        points: "[[0.2, 0.315], [0.2, -0.315], [-0.8, -0.315], [-0.8, 0.315]]"
        linear_min: -2.0
        linear_max: -0.02
        theta_min: -2.0
        theta_max: 2.0
    # MH 브링업은 /scan·/scan_b 를 내지 않는다 (두 SICK 는 /scan_front·/scan_rear, 합친 결과는 /scan_merge).
    # 없는 토픽을 소스로 두면 "invalid source" 로 항상 정지 명령을 내 Nav2 가 한 발짝도 움직이지 못했다
    observation_sources: ["scan_merge"]
    scan_merge:
      type: "scan"
      topic: "/scan_merge"
      min_height: 0.15
      max_height: 2.0
      enabled: True


# 이 섹션이 없으면 docking_server 가 configure 에 실패해(dock 플러그인 없음) 웹 관제의 도킹·언도킹이 동작하지 않았다.
# EDU 와 같은 전방 RealSense 태그 도킹을 기반으로 하고, 기하값은 MH 실측(2026-11-03, 충전 중 자세)으로 맞췄다:
#   도킹 완료 자세에서 base_link -> 태그 = x 0.677 m, y -0.007 m, z 0.166 m (앞 범퍼 x 0.4 m 에서 태그까지 약 0.28 m)
#   카메라(camera1_color_optical_frame) x 0.366 m -> 도킹 때 카메라-태그 약 0.31 m, 태그가 카메라와 거의 같은 높이라 끝까지 시야 안
# 태그: 36h11, 0.1 m (예전 MH ros2_ws 와 같음). 웹 옵션 docking_front: 1 (전방 도킹)
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    # 처음 시험하는 설정이라 실패하면 재시도 후진 없이 그 자리에 멈추고 API 가 이유를 웹에 알린다
    # 접근 중 태그를 끝내 못 찾으면 staging 으로 물러나 한 번 더 찾는다 (실기 2026-11-18: 0 이라 한 번 놓치면 바로 실패)
    max_retries: 1

    base_frame: "base_link"
    fixed_frame: "odom"
    dock_prestaging_tolerance: 0.15
    dock_backwards: false

    # API 는 충전 도킹·언도킹을 tetra_charging_dock 으로 요청한다 (도킹 인스턴스는 API 가 지도의 도킹 위치로 reload_database 한다)
    dock_plugins: ['tetra_charging_dock']

    tetra_charging_dock:
      plugin: 'tetra_docking::TetraChargingDock'
      # 도크 자세 도착 판정 폭. 관리자 설정의 도킹 영점(docking_offset_x)으로 도크 자세를 충전기 바로 앞에 맞추므로
      # 판정 폭이 넓으면(예: 0.03) 충전기에 닿기 전에 "도착"으로 멈춰 접점이 안 붙는다. 접점이 먼저 오면 그대로 성공이다
      docking_threshold: 0.005
      # 도착을 도크 축 깊이로만 본다 (좌우 잔여 오차 1~2 cm 때문에 5 mm 판정이 끝내 안 맞아 충전기를 밀던 것을 막는다)
      docked_by_depth: true
      # 깊이 도착 판정을 도크 자세보다 더 깊게 두지 않는다 (tetra_docking dock_offset.cpp contact_overtravel).
      # 1.5 cm 를 두었던 것은 도착 판정 뒤 휠 드라이버 cmd_vel_timeout 0.5 초 동안 밀려 들어갈 때만 접점이 붙었기 때문이다
      # (2026-11-18 10:51, 16:39, 18:19). 지금은 접점 신호가 오면 플러그인이 바로 0 속도를 내므로(contact_stop.cpp)
      # 1.5 cm 는 판정을 0.675 m(충전기 몸체 0.673 m 바로 앞)로 당겨 접점 신호가 늦는 0.2~0.3 초 동안 스테이션을 밀었다
      # (실기 2026-11-23: 0.015 이면 태그 0.6724 m 에서 멈춤, 0 + 관성일 때 바르게 붙은 자세 0.6745 m).
      # 도킹 속도를 크게 낮춰 접점까지 못 가면 다시 0.005~0.01 로 올린다
      contact_overtravel: 0.0
      # 언도킹 후진 거리. MH 는 후방 라이다가 있지만 처음엔 EDU 와 같이 짧게 둔다
      staging_x_offset: -0.4
      staging_yaw_offset: 0.0
      use_battery_status: false
      use_stall_detection: false

      use_external_detection_pose: true
      tag_tf_as_detection: true
      marker_family: "tag36h11:"
      camera_frame: "camera1_color_optical_frame"
      external_detection_timeout: 1.0
      # apriltag_ros 태그 프레임은 z 가 카메라 쪽을 향한다. Y 축 +90도로 도크 x 축을 태그 안쪽(-z)으로 돌린다 (EDU 와 같음).
      # 실측(2026-11-03): 태그 위치는 카메라-태그 0.3~1.3 m 에서 1 cm 안으로 일정했지만 태그 방향은 보는 자리마다 2~4도 달라졌다.
      # 도킹된 세 자세에서 이 값으로 구한 도크 방향은 -2.1, +0.6, -0.8도로 한쪽으로 치우치지 않아 보정하지 않는다
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: 0.0
      external_detection_rotation_yaw: 0.0
      # 태그면 -> 도킹을 마친 base_link 위치
      # 실측(2026-11-03 13:25): 0.075 m/s 로 들어가 base_link-태그 0.673 m 에서 충전기에 닿아 바로 멈췄고(앞 범퍼 눌림),
      # 접점(docking_status 5)은 그 0.3 초 뒤에 왔다. 손으로 붙인 자세(0.677 m)는 범퍼 없이 충전됐다.
      # 지금 값은 도크 자세가 충전기 몸체보다 2.8 cm 안쪽이라 감속 전에 닿아, 충전 중 범퍼가 눌린 채 남는다
      external_detection_translation_x: -0.645
      external_detection_translation_y: 0.0
      filter_coef: 0.1

      docking_status_topic: "docking_status"
      contact_status_val: 2
      charge_requires_contact: true
      blind_approach_distance: 0.25
      blind_approach_timeout: 8.0
      # 비스듬히 접근하다 태그를 놓치면 1 m 안에서는 마지막 태그 위치 쪽으로 몰아 다시 찾는다. 4 초 안에 안 보이면 멈춘다
      lost_tag_reacquire_distance: 1.0
      lost_tag_reacquire_time: 4.0
      # staging 에서 태그가 안 보이면 좌우 35 도까지 돌며 찾고, 보이면 영상 중앙으로 돌려 맞춘 뒤 접근한다
      tag_search_angle: 0.6
      tag_search_speed: 0.1
      # bumper_data 비트 (예전 MH tetra.cpp, tetra_wheel_driver 와 같음): 0x01 앞 범퍼, 0x02 서보 꺼짐, 0x08 뒤 범퍼.
      # 구동 보드는 범퍼만으로 서보를 끄지 않는다. 접근 중 접점 없이 앞 범퍼가 1.5 초 넘게 눌리면 멈춘다
      # (실기 12:58: 앞 범퍼는 접점과 같은 순간에 눌려 접점이 먼저 판정됐다)
      bumper_topic: "bumper_data"
      bumper_mask: 1
      bumper_grace: 1.5
      # 언도킹 후진 중 뒤 범퍼가 눌리면 바로 멈춘다
      undock_bumper_mask: 8
      heading_priority_near: 0.15
      heading_priority_far: 0.30

      # 태그가 보이면 태그 정면 축 위 staging 으로 Nav2 주행한 뒤 직선 접근. 0.75 m 면 카메라-태그 약 1.03 m (태그 약 59 px)
      tag_staging: true
      tag_staging_distance: 0.75
      tag_staging_distance_min: 0.45
      tag_staging_distance_max: 0.95
      camera_info_topic: "/camera1/color/camera_info"
      tag_size: 0.1

    controller:
      # 접근 속도 v = clamp(v_linear_max * r / slowdown_radius, v_linear_min, v_linear_max), r = 도크 자세까지 남은 거리 + 0.25 m
      # (도킹 서버가 제어 목표를 도크 자세 0.25 m 안쪽에 둔다). 0.65 면 도크 0.4 m 앞부터 줄여 약 0.04 m/s 로 닿는다
      # (예전 0.45 / 0.05: 0.2 m 앞부터 줄다가 0.056 m/s 로 닿았다). 곡선 모양(k_phi·k_delta)은 속도와 상관없다.
      # 관제가 도킹 목표마다 관리자 설정(도킹 속도·감속 시작 거리)으로 v_linear_max·v_linear_min·slowdown_radius 를 덮어쓴다
      # (TetraSingleManagement lib/robot/services/dock-speed.ts). 여기 값은 관제 없이 도킹하거나 재시작 뒤 첫 언도킹에 쓴다
      k_phi: 5.0
      k_delta: 3.0
      v_linear_min: 0.0385
      v_linear_max: 0.10
      v_angular_max: 0.15
      slowdown_radius: 0.65

      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      # 충전기 본체(앞 범퍼에서 태그까지 약 0.28 m)가 장애물로 잡힌다. 도크 자세 0.45 m 안에서는 충돌 검사에서 뺀다
      dock_collision_threshold: 0.45
